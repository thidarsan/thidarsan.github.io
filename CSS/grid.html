<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Grid lesson</h1>
    <div class="gridone">
        <div style="background-color: blue;">1</div>
        <div style="background-color: red;">2</div>
        <div style="background-color: gray;">3</div>
        <div style="background-color: yellow;">4</div>
        <div style="background-color: black;">5</div>
        <div style="background-color: purple;">6</div>
        <div style="background-color: brown;">7</div>
        <div style="background-color: greenyellow;">8</div>
        <div style="background-color: rgb(255, 166, 0);">9</div>
    </div>
    <br><br>

    <h1>Grid Column Gap</h1>
    <div class="gridtwo">
        <div style="background-color: blue;">1</div>
        <div style="background-color: red;">2</div>
        <div style="background-color: gray;">3</div>
        <div style="background-color: yellow;">4</div>
        <div style="background-color: black;">5</div>
        <div style="background-color: purple;">6</div>
        <div style="background-color: brown;">7</div>
        <div style="background-color: greenyellow;">8</div>
        <div style="background-color: rgb(255, 166, 0);">9</div>
    </div>
    <br><br>

    <h1>Grid Row Gap</h1>
    <div class="gridthree">
        <div style="background-color: blue;">1</div>
        <div style="background-color: red;">2</div>
        <div style="background-color: gray;">3</div>
        <div style="background-color: yellow;">4</div>
        <div style="background-color: black;">5</div>
        <div style="background-color: purple;">6</div>
        <div style="background-color: brown;">7</div>
        <div style="background-color: greenyellow;">8</div>
        <div style="background-color: rgb(255, 166, 0);">9</div>
    </div>
    <br><br>

    <h1>Grid Gap</h1>
    <div class="gridfour">
        <div style="background-color: blue;">1</div>
        <div style="background-color: red;">2</div>
        <div style="background-color: gray;">3</div>
        <div style="background-color: yellow;">4</div>
        <div style="background-color: black;">5</div>
        <div style="background-color: purple;">6</div>
        <div style="background-color: brown;">7</div>
        <div style="background-color: greenyellow;">8</div>
        <div style="background-color: rgb(255, 166, 0);">9</div>
    </div>
    <br><br>

    <h1>Grid Column</h1>
    <div class="gridfive">
        <div style="background-color: blue;" class="columnadd">1</div>
        <div style="background-color: red;">2</div>
        <div style="background-color: gray;">3</div>
        <div style="background-color: yellow;">4</div>
        <div style="background-color: black;">5</div>
        <div style="background-color: purple;">6</div>
        <div style="background-color: brown;">7</div>
        <div style="background-color: greenyellow;">8</div>
        <div style="background-color: rgb(255, 166, 0);">9</div>
    </div>
    <br><br>

    <h1>Grid Row</h1>
    <div class="gridsix">
        <div style="background-color: blue;" class="rowadd">1</div>
        <div style="background-color: red;">2</div>
        <div style="background-color: gray;">3</div>
        <div style="background-color: yellow;" >4</div>
        <div style="background-color: black;">5</div>
        <div style="background-color: purple;">6</div>
        <div style="background-color: brown;">7</div>
        <div style="background-color: greenyellow;">8</div>
        <div style="background-color: rgb(255, 166, 0);">9</div>

    </div>
</body>
</html>
