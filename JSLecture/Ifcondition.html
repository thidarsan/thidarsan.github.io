<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If condition</title>
</head>
<body>
    <h1>If condition</h1>
    <script>
        // // Syntax
        // if(condition=true){
        //     // code
        // }


        let number = prompt(" Enter number");
        // document.write(number);

        if(number<100){
            // code
            document.write("Your Number is less than 100");
        }else if(number>100) {
            document.write("Your Numbe is greater than 100");
        }else if(number==100) {
            document.write("Your Numbe is equal 100");
        }else{
            document.write("None of these");
        }
    </script>
</body>
</html>
