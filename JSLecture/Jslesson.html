<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Lesson</title>
</head>
<body>
    <h1>JS Lesson</h1>
    <script>
  
        let num1 = prompt(" Enter number");    
    
        if( num1 % 2==0 ){
            document.write("This is Even");
            document.write("<br>")
        }

        else if(num1 % 2 == 1 ){
            document.write("This is Odd");
            document.write("<br");
        }

        else{
            document.write("This is Not Number");
            document.write("<br");
        }
    </script>
</body>
</html>
