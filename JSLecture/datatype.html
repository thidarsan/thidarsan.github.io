<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Type</title>
</head>
<body>
    <h1>Data Types</h1>

    <script>
        // string data type
        var name = " Thidar San";
        // var name = ` Thidar San`;
        // var name = 'Thidar San';
        console.log(name);
        console.log(typeof(name));


        // number data type
        var num = 23;
        console.log(num);
        console.log(typeof(num));


        // Boolean data type
        var single = true;
        console.log(single);
        console.log(typeof(single));

        // Null data type
        var son = null;
        console.log(son);
        console.log(typeof(son));

        // undifinded
        var mybaby;
        console.log(mybaby);

        // array data type
        var array1 = new Array (1,2,3,4, "a", "b", "c");
        console.log(array1);
        console.log(typeof(array1));
        console.log(array1[4]);

        var multiArray = ['Mg Mg','Ma Ma', 'Hla Hla', 'Aung Aung', 'Tun Tun', 'Mya Mya'];
        console.log(multiArray);
        console.log(multiArray[3]);
        console.log(multiArray[5]);

        // object
        var student = {
            // key : value
            name : "Thidar San",
            age : 28,
            address : "Yangon, Latha Township",
            color : ['red', 'blue']

        }

        console.log(student);
        console.log(student.name);
        console.log(student.color[1]);


    </script>


</body>
</html>
