<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators Lesson</title>
</head>
<body>
    <h1>Operators</h1>
    <script>
        // assign operator
        var name = " Thidrar San";




        // additional operator
        var three = 1 + 2;
        document.write(three);
        // console.log(three);
        document.write("<br>");
        var five = three + 2;
        document.write(five);
        document.write("<br>");

        var onethree = 1 + 3;
        // console.log(onethree);/
        document.write(onethree);
        document.write("<br>");

        let number = 7;
        document.write(number);
        document.write("<br>");
        number += 3 ;
        // number += number + 3;
        document.write (number);

        // substration Operator
        let two = 3 - 1;
        document.write(two);
        document.write("<br>");
        let sub = 30;
        document.write(sub);
        document.write("<br>");
        sub -= 20;
        document.write(sub);
        document.write("<br>");

        // division
        let div = 20 / 4 ;
        document.write(div);
        document.write("<br>");

        let div2 = 50;
        div2 /= 2;
        document.write(div2);
        document.write("<br>");

        // Remainder operator
        let rem1 =  20 % 4;
        document.write(rem1);
        document.write("<br>");

        // multiplication operator
        let multi1 = 2000 * 123;
        document.write(multi1);
        document.write("<br>");


        // exponentation operator(ထပ်ကိန်း)
        let exp1 = 3 ** 3;
        document.write(exp1);
        document.write("<br>");

        // precendence အစဉ်လိုက် အလုပ်လုပ်တာ (ကွင်း * / + -)
        let total = 1 * ( 2 + 5 ) / 2 % 2 - 5 ;
        document.write(total);
        document.write("<br>");


        




    </script>

</body>
</html>
