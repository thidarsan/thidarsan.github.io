<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable</title>
</head>
<body>
    <h1>Three Types of Variable</h1>

    <script>
        // global Variable
        var name = " Thidar San";
        name = "Thidar San Update";
        console.log (name);


        // block scope variable
        let fathername = "U Po";
        console.log(fathername);
        fathername = " U Po Update";
        console.log(fathername);

        var num = 2;
        if(num){
            var num1 = 2;
            var num2 = 3;
            document.write(num1);
        }

        // const variable
        const motherName = "Daw Htay Yin";
        console.log(motherName);
        console.log(motherName);

    </script>
</body>
</html>
